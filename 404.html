<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#050B1A">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'sha256-r4w1ShP0PZZ6FO7WlSCT6qXYThViua4Ax3imHYsOPdI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#050B1A; --ink:#F2F6FF; --muted:#B3C1DB; --blue:#5AA2FF; --line:rgba(148,177,255,.2); }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 400 16px/1.65 Inter, system-ui, sans-serif; overflow-x: hidden;
      background-image: radial-gradient(700px 500px at 85% 0%, rgba(59,123,255,.4), transparent 60%), radial-gradient(600px 450px at 0% 100%, rgba(122,77,255,.3), transparent 60%); }
    main { width: min(100%, 560px); padding: clamp(28px, 6vw, 52px); border: 1px solid var(--line); border-radius: 32px; text-align: center; backdrop-filter: blur(20px);
      background: linear-gradient(155deg, rgba(130,170,255,.16), rgba(5,12,38,.45)); box-shadow: 0 40px 80px -40px rgba(30,80,255,.5); }
    .brand { display: inline-flex; align-items: center; gap: 7px; font: 700 24px/1 "Space Grotesk", sans-serif; color: var(--ink); text-decoration: none; min-height: 44px; }
    .brand i { width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: #8EC1FF; box-shadow: 0 0 6px 1px rgba(142,193,255,.9), 0 0 16px 4px rgba(90,162,255,.55); }
    .code { margin: 18px 0 4px; font: 700 clamp(84px, 24vw, 140px)/1 "Space Grotesk", sans-serif; letter-spacing: -.04em; background: linear-gradient(180deg, #CFE2FF, #4C8DFF); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    h1 { font: 700 clamp(24px, 5vw, 32px)/1.2 "Space Grotesk", sans-serif; letter-spacing: -.02em; }
    p { margin-top: 12px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px; border-radius: 99px; font-weight: 600; text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: rgba(255,255,255,.05); }
    .btn--primary { color: #04101F; border: 0; background: linear-gradient(135deg, #8EC1FF, #4C8DFF); box-shadow: 0 10px 30px -10px rgba(76,141,255,.8); }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <a class="brand" id="brand" href="/" aria-label="Akshaya Reddy, home">AR<i aria-hidden="true"></i></a>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page took a different route.</h1>
    <p>The link may be mistyped or out of date. The portfolio is one click away.</p>
    <div class="actions">
      <a class="btn btn--primary" id="home" href="/">Back to the portfolio</a>
      <a class="btn" href="mailto:srinagaakshaya275@gmail.com">Email me</a>
    </div>
  </main>
  <script>/* The site lives at user.github.io/<repo>/ now and may move to a custom domain later,
   so work out the home path from where we are instead of hard-coding it. */
(function () {
  var onGithubPages = /\.github\.io$/.test(location.hostname);
  var seg = location.pathname.split('/')[1];
  var base = onGithubPages && seg ? '/' + seg + '/' : '/';
  document.getElementById('home').href = base;
  document.getElementById('brand').href = base;
  var icon = document.querySelector('link[rel=icon]'); if (icon) icon.href = base + 'favicon.svg';
})();
</script>
</body>
</html>
